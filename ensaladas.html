<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Desayunos - Healthy Way</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="page-banner">
    <h1>ENSALADAS</h1>    

    <a href="index.html" class="back-btn">

    </a>

  <section class="food-section">

    <div class="food-container">
      
      <div class="food-card">
        <img src="./images/ENSALADAS/Ensalada Fresh.png">

        <div class="food-info">
          <h3>Ensalada Fresh</h3>

          <div class="price">
            Q25.00
          </div>

          <p>
            Lechuga, tomate, pepino y zanahoria. 
          </p>
        </div>
      </div>
      
      <div class="food-card">
        <img src="./images/ENSALADAS/Ensalada Chicken.png">

          <h3>Ensalada Chicken</h3>

          <div class="price">
            Q30.00
          </div>

            Vegetales frescos con pollo grillado. 
          </p>
        </div>
      </div>

      <div class="food-card">
        <img src="./images/ENSALADAS/Ensalada Vegana.png">

        <div class="food-info">
          <h3>Ensalada Vegana</h3>

          <div class="price">
            Q28.00
          </div>

          <p>
            Mix verde, aguacate, garbanzos y semillas.

      </div>
